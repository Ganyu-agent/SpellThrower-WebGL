name: Deploy WebGL to GitHub Pages

on:
  push:
    branches:
      - main
    paths:
      - "WebGLBuild/**"
      - ".github/workflows/deploy-webgl.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Verify WebGL artifact
        shell: bash
        run: |
          test -f WebGLBuild/index.html
          test -d WebGLBuild/Build
          test -f WebGLBuild/.nojekyll

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: WebGLBuild

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
